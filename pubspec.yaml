name: jokerstreet
description: "Joker Street — festival tap arcade with a live carnival portal."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Native game state
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3

  # Carnival portal stack
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.12.0
  connectivity_plus: ^7.0.0
  appsflyer_sdk: ^6.17.0
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5
  flutter_local_notifications: ^22.0.1
  flutter_secure_storage: ^10.3.1
  device_info_plus: 11.3.0
  http: ^1.5.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/generated/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-VariableFont.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/generated/app_icon.png"
  adaptive_icon_background: "assets/generated/app_icon_background.png"
  adaptive_icon_foreground: "assets/generated/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
