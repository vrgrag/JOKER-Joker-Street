org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin's incremental compiler computes relative paths between the
# project directory and the Gradle/Pub caches. On Windows this throws
# "this and base files have different roots" whenever those two live on
# different drive letters (e.g. project on D:, caches on C:). Disabling
# incremental compilation avoids that path-relativization code entirely.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
